name: Bug report
description: Report reproducible incorrect behavior in ConfigLab.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or include secrets here. Follow SECURITY.md for private reporting.
  - type: input
    id: version
    attributes:
      label: ConfigLab version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: rust
    attributes:
      label: Rust version
      description: Output of `rustc --version`.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including redaction-safe diagnostics.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small schema, source inputs, and the command used. Remove all credentials.
      render: rust
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Additional environment details
      description: Operating system, enabled features, and anything else relevant.
